<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shell · Upload</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 500;
    letter-spacing: 1px;
    margin-bottom: 8px;
    color: var(--accent);
  }
  .sub {
    font-size: 0.85rem;
    opacity: 0.6;
    margin-bottom: 32px;
  }
  .dropzone {
    width: 100%;
    max-width: 520px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    background: var(--panel);
    padding: 48px 24px;
    text-align: center;
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
  }
  .dropzone.dragover {
    border-color: var(--accent);
    background: #1c2128;
  }
  .dropzone p {
    font-size: 0.95rem;
    margin-top: 12px;
    opacity: 0.7;
  }
  .icon { font-size: 2.4rem; opacity: 0.5; }
  input[type="file"] { display: none; }
  .btn {
    margin-top: 20px;
    background: var(--accent);
    color: #0d1117;
    border: none;
    padding: 10px 28px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .file-list {
    width: 100%;
    max-width: 520px;
    margin-top: 28px;
  }
  .file-item {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: 0.88rem;
  }
  .file-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .file-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 260px;
  }
  .file-size {
    opacity: 0.55;
    font-size: 0.8rem;
    margin-top: 2px;
  }
  .status {
    font-size: 0.8rem;
    font-weight: 500;
  }
  .status.ok { color: var(--green); }
  .status.err { color: var(--red); }
  .status.wait { color: var(--accent); }
  .progress {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    width: 0%;
    transition: width 0.2s;
  }
  .link-box {
    margin-top: 12px;
    padding: 10px 12px;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 6px;
    display: none;
  }
  .link-box a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .link-box a:hover { text-decoration: underline; }
  .footer {
    margin-top: 40px;
    font-size: 0.75rem;
    opacity: 0.35;
  }
</style>
</head>
<body>

<h1>◆ SHELL · UPLOAD</h1>
<div class="sub">drop any file · multi-select · direct link after upload</div>

<div class="dropzone" id="dropzone">
  <div class="icon">⬆</div>
  <p>Drag & drop files here<br>or click to browse</p>
  <input type="file" id="fileInput" multiple>
</div>

<button class="btn" id="uploadBtn" disabled>Upload Selected</button>

<div class="file-list" id="fileList"></div>

<div class="footer">local object-url · click the link to open / download</div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const uploadBtn = document.getElementById('uploadBtn');
const fileList = document.getElementById('fileList');

let selectedFiles = [];

dropzone.addEventListener('click', () => fileInput.click());

dropzone.addEventListener('dragover', e => {
  e.preventDefault();
  dropzone.classList.add('dragover');
});

dropzone.addEventListener('dragleave', () => {
  dropzone.classList.remove('dragover');
});

dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', () => {
  handleFiles(fileInput.files);
});

function handleFiles(files) {
  selectedFiles = Array.from(files);
  renderList();
  uploadBtn.disabled = selectedFiles.length === 0;
}

function renderList() {
  fileList.innerHTML = '';
  selectedFiles.forEach((file, idx) => {
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `
      <div class="file-top">
        <div>
          <div class="file-name">${file.name}</div>
          <div class="file-size">${formatSize(file.size)}</div>
        </div>
        <div class="status wait" id="status-${idx}">ready</div>
      </div>
      <div class="progress"><div class="progress-bar" id="bar-${idx}"></div></div>
      <div class="link-box" id="link-${idx}">
        <a href="#" target="_blank" id="a-${idx}">Click here</a>
      </div>
    `;
    fileList.appendChild(item);
  });
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

uploadBtn.addEventListener('click', async () => {
  if (!selectedFiles.length) return;
  uploadBtn.disabled = true;

  for (let i = 0; i < selectedFiles.length; i++) {
    const file = selectedFiles[i];
    const statusEl = document.getElementById(`status-${i}`);
    const barEl = document.getElementById(`bar-${i}`);
    const linkBox = document.getElementById(`link-${i}`);
    const aEl = document.getElementById(`a-${i}`);

    statusEl.textContent = 'uploading…';
    statusEl.className = 'status wait';

    // progress simulation
    await simulateUpload(barEl);

    // create direct object URL
    const url = URL.createObjectURL(file);
    aEl.href = url;
    aEl.download = file.name;   // force download when clicked
    linkBox.style.display = 'block';

    statusEl.textContent = 'done';
    statusEl.className = 'status ok';
  }

  uploadBtn.disabled = false;
});

function simulateUpload(barEl) {
  return new Promise(resolve => {
    let p = 0;
    const interval = setInterval(() => {
      p += Math.random() * 18 + 8;
      if (p >= 100) {
        p = 100;
        clearInterval(interval);
        barEl.style.width = '100%';
        resolve();
      } else {
        barEl.style.width = p + '%';
      }
    }, 100);
  });
}
</script>
</body>
</html>
